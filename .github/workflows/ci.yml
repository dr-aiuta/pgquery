name: CI

# Type check and tests on every pull request and on every push to main.
# The tests include the live suites, which need a real PostgreSQL server.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Any version from 12 up works.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run format:check

      # Files in src/sql only build SQL text. They never import connection.ts.
      - name: Check that src/sql stays pure
        run: |
          if grep -rn "connection" src/sql; then
            echo "A file in src/sql mentions connection. src/sql must not import connection.ts."
            exit 1
          fi

      # The live suites are skipped when this variable is unset.
      - run: npm test
        env:
          PGLIGHTQUERY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
